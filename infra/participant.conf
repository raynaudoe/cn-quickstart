# Separate package storage preserves DEX DAR pins that conflict with Splice-managed packages.
canton {
  parameters.non-standard-config = yes
  participants.application {
    storage {
      type = postgres
      config {
        dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
        properties {
          serverName = postgres
          databaseName = participant-application
          currentSchema = participant
          user = cnadmin
          password = supersafe
        }
      }
      parameters.max-connections = 16
    }
    http-ledger-api.enabled = false
    admin-api { address = "0.0.0.0", port = 5002 }
    ledger-api {
      address = "0.0.0.0"
      port = 5001
      auth-services = [{
        type = jwt-jwks
        url = "http://keycloak:8082/realms/AppProvider/protocol/openid-connect/certs"
        target-audience = "https://canton.network.global"
      }]
      user-management-service.additional-admin-user-id = "c87743ab-80e0-4b83-935a-4c0582226691"
    }
    monitoring.grpc-health-server { address = "0.0.0.0", port = 5061 }
    parameters.initial-protocol-version = 35
    init.ledger-api.max-deduplication-duration = 30s
  }
}
