server:
  port: ${BACKEND_PORT:8080}

spring:
  profiles:
    default: shared-secret
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:application}
    username: ${POSTGRES_USERNAME:cnadmin}
    password: ${POSTGRES_PASSWORD:supersafe}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

ledger:
  host: ${LEDGER_HOST:localhost}
  port: ${LEDGER_PORT:3901}
  plaintext: ${LEDGER_PLAINTEXT:true}
  token: ${APP_PROVIDER_BACKEND_USER_TOKEN:}
