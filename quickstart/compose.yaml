services:
  backend-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./docker/backend-service/env/app.env
    volumes:
      - onboarding:/onboarding:ro
    expose:
      - "${BACKEND_PORT}"
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      splice-onboarding:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      AUTH_MODE: ${AUTH_MODE}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:80"
    depends_on:
      backend-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    environment:
      CREATE_DATABASE_application: ${APPLICATION_DATABASE}

  splice-onboarding:
    env_file:
      - ./docker/backend-service/onboarding/env/${AUTH_MODE}.env
    volumes:
      - ./docker/backend-service/onboarding/onboarding.sh:/app/scripts/on/backend-service.sh:ro
